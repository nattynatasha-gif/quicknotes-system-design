<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes</title>
  <link rel="stylesheet" href="style.css">
  <script src="api.js" defer></script>
</head>
<body>
  <header>
    <h1>QuickNotes</h1>
    <p class="subtitle">Your simple online notebook</p>
  </header>

  <main>
    <section class="controls">
      <button id="load-btn" type="button">Load notes</button>
      <p id="status" role="status" aria-live="polite"></p>
    </section>

    <section class="create-note">
      <h2>Create a note</h2>
      <form id="note-form">
        <div class="form-group">
          <label for="title-input">Title <span class="required">*</span></label>
          <input type="text" id="title-input" name="title" maxlength="100" required placeholder="Note title (max 100 characters)">
        </div>
        <div class="form-group">
          <label for="body-input">Body</label>
          <textarea id="body-input" name="body" rows="4" placeholder="Optional note body"></textarea>
        </div>
        <button type="submit" id="submit-btn">Create note</button>
      </form>
    </section>

    <section class="notes">
      <h2>Notes</h2>
      <ul id="notes-list"></ul>
    </section>
  </main>

  <footer>
    <p>QuickNotes System Design – Project 2</p>
  </footer>
</body>
</html>
